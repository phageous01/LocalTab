<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>乐谱打印</title>
    <script src="/vendor/package/dist/alphaTab.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #ecefe9;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #203b3a;
      }
      .toolbar {
        position: sticky;
        top: 0;
        background: #fff;
        padding: 15px 25px;
        z-index: 10;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button {
        padding: 10px 18px;
        background: #176c61;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
      }
      #sheet {
        box-sizing: border-box;
        width: 186mm;
        background: #fff;
        margin: 24px auto;
        padding: 0;
      }
      .at-surface {
        width: auto !important;
        height: auto !important;
      }
      .at-surface > div {
        position: relative !important;
        left: auto !important;
        top: auto !important;
        break-inside: avoid;
      }
      @page {
        size: A4;
        margin: 12mm;
      }
      @media print {
        body {
          background: white;
        }
        .toolbar {
          display: none;
        }
        #sheet {
          margin: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span id="status">正在排版完整乐谱…</span
      ><button id="print" disabled>打印 / 另存为 PDF</button>
    </div>
    <div id="sheet"></div>
    <script type="module">
      import { t, bindTranslations, setLanguage } from "./i18n.js";
      import { ScoreDocument, applyDisplaySettings } from "./editor-model.js";
      const params = new URLSearchParams(location.search);
      if (params.has("lang")) setLanguage(params.get("lang"));
      bindTranslations(document);
      const id = params.get("project"), draft = params.get("draft");
      window.localTabPrintState = { ready: false };
      try {
        const r = await fetch(draft
          ? "/api/publish/snapshot/" + encodeURIComponent(draft)
          : "/api/project/" + encodeURIComponent(id));
        if (!r.ok) throw Error(t("项目不存在"));
        const data = await r.json();
        document.title = data.project.title;
        const sheet = document.getElementById("sheet");
        const titleMeasure = document.createElement("canvas").getContext("2d");
        titleMeasure.font = "32px Georgia, serif";
        const titleWidth = titleMeasure.measureText(data.project.title).width;
        const titleSize = Math.min(32, 32 * (sheet.clientWidth - 80) / 0.85 / Math.max(1, titleWidth));
        const api = new alphaTab.AlphaTabApi(document.getElementById("sheet"), {
          core: {
            engine: "svg",
            useWorkers: false,
            enableLazyLoading: false,
            fontDirectory: location.origin + "/vendor/package/dist/font/",
          },
          display: {
            layoutMode: alphaTab.LayoutMode.Page,
            startBar: 1,
            barCount: -1,
            barsPerRow: -1,
            scale: 0.85,
            resources: { titleFont: `${titleSize}px Georgia, serif` },
          },
          player: { playerMode: alphaTab.PlayerMode.Disabled },
          notation: {
            rhythmMode: alphaTab.TabRhythmMode.ShowWithBars,
            rhythmHeight: 25,
          },
        });
        const score = alphaTab.importer.ScoreLoader.loadScoreFromBytes(
          new TextEncoder().encode(data.xml),
          api.settings,
        );
        applyDisplaySettings(score, new ScoreDocument(data.xml));
        // Project titles include the instrument name when printing a part.
        score.title = data.project.title;
        // Percussion and piano must not acquire a synthetic guitar TAB staff.
        for (const track of score.tracks)
          for (const staff of track.staves)
            staff.showTablature = !staff.isPercussion && staff.tuning.length > 0;
        api.error.on((e) => {
          window.localTabPrintState = { error: String(e.message || e) };
          document.getElementById("status").textContent = window.localTabPrintState.error;
        });
        api.postRenderFinished.on(async () => {
          await document.fonts.ready;
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          document.getElementById("status").textContent =
            data.project.title + t(" · 完整乐谱 · A4");
          document.getElementById("print").disabled = false;
          window.localTabPrintState = { ready: true, measures: score.masterBars.length };
        });
        const requested = (params.get("tracks") || "").split(",").filter(Boolean).map(Number);
        const tracks = requested.length ? [...new Set(requested)].filter((i) => Number.isInteger(i) && score.tracks[i])
          : score.tracks.map((track) => track.index);
        api.renderScore(score, tracks.length ? tracks : score.tracks.map((track) => track.index));
        document.getElementById("print").onclick = () => window.print();
      } catch (e) {
        window.localTabPrintState = { error: e.message };
        document.getElementById("status").textContent = e.message;
      }
    </script>
  </body>
</html>
